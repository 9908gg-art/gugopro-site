  function initMarketFromUrl() {
    var params = new URLSearchParams(window.location.search);

    if (m === 'jp' || m === 'us') {
      currentMarket = m;
    } else if (window.location.pathname.indexOf('amazon-jp') !== -1) {
      currentMarket = 'jp';
    } else {
      currentMarket = 'us';
    }
  }

  function buildAmazonSearchUrl(keyword, options) {
    var conf = MARKETS[currentMarket];
    var tag = currentMarket === 'jp' ? JP_TAG : US_TAG;
    var url = new URL(conf.baseUrl);
    url.searchParams.set('k', (keyword || '').trim());
    url.searchParams.set('tag', tag);

    options = options || {};
    if (options.s) url.searchParams.set('s', options.s);
    if (options.rh) url.searchParams.set('rh', options.rh);

    // Price range filters
    var low = options.low || (document.getElementById('input-price-low') ? document.getElementById('input-price-low').value : '');
    var high = options.high || (document.getElementById('input-price-high') ? document.getElementById('input-price-high').value : '');
    if (low && !isNaN(Number(low))) url.searchParams.set('low-price', Math.round(Number(low)));
    if (high && !isNaN(Number(high))) url.searchParams.set('high-price', Math.round(Number(high)));

    return url.toString();
  }

  window.doSearch = function(keyword, options) {
    if (!keyword) {
      var input = document.getElementById('input-keyword');
      keyword = input ? input.value : '';

    if (!keyword || !keyword.trim()) return;

    var targetUrl = buildAmazonSearchUrl(keyword, options);
    window.open(targetUrl, '_blank', 'noopener,noreferrer');

    if (typeof gtag === 'function') {
      gtag('event', 'amazon_search_click', {
        'event_category': 'ecommerce',
        'event_label': currentMarket.toUpperCase() + ': ' + keyword

  async function fetchJsonFirstValid(paths) {
    for (var i = 0; i < paths.length; i++) {
      try {
        var res = await fetch(paths[i], { cache: 'no-store' });
        if (res.ok) {
          var data = await res.json();
          if (data) return data;
        }
      } catch(e) {}
    }
    return null;
  }

  async function loadMarketData() {

    // 1. Instant fallback rendering (0ms delay)
    if (EMBEDDED_DATA[currentMarket]) {
      renderTree(EMBEDDED_DATA[currentMarket]);

    // 2. Fetch fresh JSON in background
    try {
      var data = await fetchJsonFirstValid(conf.dataPaths);
      if (data && data.categories) {
        renderTree(data);
      }
    } catch(e) {}

    // 3. Load Facet chips
    loadFacets(conf.facetsPaths || []);
  }

      results.forEach(function(data) {
        if (!data || !data.facet_groups) return;
        data.facet_groups.forEach(function(group) {
          (group.facets || []).forEach(function(f) {
            var displayLabel = f.label_tw || f.label || f.label_jp;
            if (seenLabels.has(displayLabel)) return;
            seenLabels.add(displayLabel);
            foundAny = true;
            var query = (f.search_query || f.label_jp || f.label || '').replace(/'/g, "\\'");
            html += '<span class="facet-pill" onclick="applyFacetSearch(\'' + query + '\')">' +
                      displayLabel +
                    '</span>';
          });
        });
      });

      container.innerHTML = foundAny ? html : '';
    });
  }

  window.applyFacetSearch = function(query) {
    var input = document.getElementById('input-keyword');
    if (input) input.value = query;
    doSearch(query);
  };

  function renderTree(treeData) {
    var deptGrid = document.getElementById('dept-grid');
    var countSummary = document.getElementById('category-summary-count');
    var categories = treeData.categories || [];
    var nCats = 0, nItems = 0;

    deptGrid.innerHTML = '';
    categories.forEach(function(dept, deptIdx) {
      var deptCard = document.createElement('div');
      deptCard.className = 'dept-card' + (deptIdx === 0 ? ' expanded' : '');

      var catsHtml = '';
      (dept.categories || []).forEach(function(cat, catIdx) {
        nCats++;
        var leafHtml = '';
        (cat.leaf_items || []).forEach(function(leaf) {
          nItems++;
          leafHtml +=
            '<div class="leaf-item" onclick="doSearch(\'' + leaf.keywords.replace(/'/g, "\\'") + '\')">' +
              '<div class="leaf-name"><span>' + leaf.name + '</span> <i class="fa-solid fa-arrow-up-right-from-square"></i></div>' +
              '<div class="leaf-kw">' + leaf.keywords + '</div>' +
            '</div>';
        });

        catsHtml +=
          '<div class="cat-box' + (catIdx === 0 ? ' expanded' : '') + '">' +
            '<div class="cat-header" onclick="this.parentElement.classList.toggle(\'expanded\')">' +
              '<span><i class="fa-solid fa-caret-right"></i> ' + cat.name + ' (' + (cat.leaf_items ? cat.leaf_items.length : 0) + ')</span>' +
            '</div>' +
            '<div class="leaf-grid">' + leafHtml + '</div>' +
          '</div>';
      });

      deptCard.innerHTML =
        '<div class="dept-header" onclick="this.parentElement.classList.toggle(\'expanded\')">' +
          '<div class="dept-header-left">' +
            '<i class="fa-solid ' + (dept.icon || 'fa-box') + '"></i>' +
            '<span>' + dept.department_name + '</span>' +
          '</div>' +
          '<div style="display:flex; align-items:center; gap:10px;">' +
            '<span style="font-size:0.8rem; color:var(--text-muted);">' + (dept.categories ? dept.categories.length : 0) + ' 分類</span>' +
            '<i class="fa-solid fa-chevron-right dept-toggle-icon"></i>' +
          '</div>' +
        '</div>' +
        '<div class="dept-body"><div class="cats-container">' + catsHtml + '</div></div>';

      deptGrid.appendChild(deptCard);
    });

    countSummary.textContent = '(' + categories.length + ' 大品類 · ' + nCats + ' 子分類 · ' + nItems + ' 精選爆品)';
  }

  /* Initialize Event Listeners */
  function initEvents() {
    var searchInput = document.getElementById('input-keyword');
    if (searchInput) {
      searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.isComposing) {
          e.preventDefault();
          handleCustomSearch();
        }
      });
    }

    var searchBtn = document.getElementById('btn-search-amazon');
    if (searchBtn) {
      searchBtn.addEventListener('click', function() {
        handleCustomSearch();
      });
    }
  }

  /* Run Init */
  initMarketFromUrl();
  switchMarket(currentMarket);
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initEvents);
  } else {
    initEvents();
  }

})();
</script>
</body>
</html>
