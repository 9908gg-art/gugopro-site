<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>複利滾存試算器｜GugoPro Academy</title><style>:root{--bg:#f5f7fb;--s:#fff;--i:#142033;--m:#637083;--b:#dfe5ee;--a:#356ae6;--t:#10a891}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font:16px/1.6 system-ui,"Noto Sans TC",sans-serif}.wrap{max-width:1000px;margin:auto;padding:26px 20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}.brand{font-weight:800;color:#142033}.back{color:var(--a);font-weight:700}.layout{display:grid;grid-template-columns:370px 1fr;gap:20px}.panel,.result{background:var(--s);border:1px solid var(--b);border-radius:18px;padding:26px;box-shadow:0 18px 45px #15264d12}.eyebrow{font-size:12px;color:var(--t);font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{font-size:34px;line-height:1.2;margin:8px 0 10px}h2{font-size:20px;margin:0 0 18px}label{display:block;font-size:13px;color:var(--m);font-weight:700;margin:15px 0 6px}input{width:100%;padding:12px;border:1px solid var(--b);border-radius:9px;font:inherit;background:var(--bg);color:var(--i)}button{border:0;background:var(--a);color:white;padding:13px 18px;border-radius:9px;font-weight:800;font-size:15px;cursor:pointer;margin-top:20px;width:100%}.big{font-size:42px;font-weight:850;color:var(--a);line-height:1.15}.sub{color:var(--m);font-size:13px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.metric{background:var(--bg);border-radius:12px;padding:14px}.metric b{display:block;font-size:20px}.chart{height:260px;display:flex;align-items:end;gap:4px;border-bottom:1px solid var(--b);padding:20px 0 0}.bar{background:linear-gradient(#356ae6,#10a891);flex:1;min-width:3px;border-radius:4px 4px 0 0;position:relative}.bar span{position:absolute;bottom:-24px;font-size:10px;color:var(--m);transform:rotate(-45deg)}.note{color:var(--m);font-size:13px;margin-top:26px}@media(max-width:760px){.layout{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.big{font-size:34px}}</style></head><body><div class="wrap"><div class="top"><a class="brand" href="../">GugoPro Academy</a><a class="back" href="../">← 回到課程</a></div><div class="layout"><section class="panel"><div class="eyebrow">Interactive lab · 01</div><h1>複利滾存試算器</h1><p>把「長期」具體化。調整投入頻率與報酬率，觀察時間如何放大本金與收益的差距。</p><label>初始本金（元）</label><input id="p" type="number" value="100000" min="0"><label>每月投入（元）</label><input id="c" type="number" value="10000" min="0"><label>年化報酬率（%）</label><input id="r" type="number" value="6" step="0.1"><label>投資年數</label><input id="y" type="number" value="20" min="1" max="80"><label>預估年通膨率（%）</label><input id="inf" type="number" value="2" step="0.1"><button id="calc">更新試算</button></section><section class="result"><div class="eyebrow">Projection</div><h2>預估期末資產</h2><div class="big" id="fv">—</div><div class="sub">以每月複利、月底投入估算</div><div class="metrics"><div class="metric"><span class="sub">投入本金</span><b id="principal">—</b></div><div class="metric"><span class="sub">複利收益</span><b id="gain">—</b></div><div class="metric"><span class="sub">今日實質價值</span><b id="real">—</b></div></div><div class="chart" id="chart"></div><p class="note">提醒：報酬率是情境假設，不代表未來表現；實際結果會受費用、稅務、波動與投入時點影響。</p></section></div></div><script>const $=id=>document.getElementById(id), money=n=>'NT$ '+Math.round(n).toLocaleString('zh-TW');function calc(){let p=+$('p').value||0,c=+$('c').value||0,r=(+$('r').value||0)/100/12,y=+$('y').value||1,inf=(+$('inf').value||0)/100;let v=p,arr=[];for(let m=1;m<=y*12;m++){v=v*(1+r)+c;if(m%12===0)arr.push(v)}let principal=p+c*y*12; $('fv').textContent=money(v);$('principal').textContent=money(principal);$('gain').textContent=money(v-principal);$('real').textContent=money(v/Math.pow(1+inf,y));let max=Math.max(...arr,1);$('chart').innerHTML=arr.map((x,i)=>`<div class="bar" style="height:${Math.max(3,x/max*205)}px"><span>第${i+1}年</span></div>`).join('')}$('calc').onclick=calc;calc();</script></body></html>
