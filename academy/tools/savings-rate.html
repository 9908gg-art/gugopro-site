<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>儲蓄率與目標路徑｜GugoPro Academy</title><meta name="description" content="GugoPro Academy 互動式財經教育工具：用情境、公式與敏感度理解投資決策。"><link rel="stylesheet" href="../academy.css"></head>
<body><header class="topbar"><div class="shell nav"><a class="brand" href="../index.html">GugoPro <span>Academy</span></a><nav class="navlinks"><a href="../index.html#curriculum">課程路徑</a><a href="../index.html#tools">互動工具</a><button class="theme-btn" data-theme aria-label="切換深色模式">◐</button></nav></div></header>
<main class="tool-page"><a class="back" href="../index.html#tools">← 返回互動工具實驗室</a><div class="tool-layout"><section class="panel"><span class="tag">個人財務 / 目標</span><h1>儲蓄率與目標路徑</h1><p>先把收入、支出與既有資產放在同一張表，估算達成資產目標所需的時間與敏感度。</p><label for="income">每月可支配收入（NT$）</label><input id="income" type="number" value="80000" min="0"><label for="expense">每月必要支出（NT$）</label><input id="expense" type="number" value="50000" min="0"><label for="asset">目前可投資資產（NT$）</label><input id="asset" type="number" value="500000" min="0"><label for="target">資產目標（NT$）</label><input id="target" type="number" value="5000000" min="0"><label for="return">假設年化報酬（%）</label><input id="return" type="number" value="5" step="0.5"><button class="calc" id="calc">更新計算</button><p class="note">本工具只在瀏覽器計算，不會上傳輸入值。結果是教育示範，不構成投資建議。</p></section><section class="result"><div class="eyebrow">Decision dashboard</div><h2>目標路徑估算</h2><div class="result-big" id="years">—</div><div class="metric-grid"><div class="metric"><small>每月儲蓄</small><b id="saving">—</b></div><div class="metric"><small>儲蓄率</small><b id="rate">—</b></div><div class="metric"><small>不含報酬所需</small><b id="simpleYears">—</b></div></div><div class="callout compact"><p><strong>閱讀方式：</strong>報酬率只是模型假設；提高儲蓄率、控制固定支出與延長時間，往往比追求更高風險的報酬更可控。請以多個情境檢查結果。</p></div></section></div></main><footer class="footer"><div class="shell"><strong>GugoPro Academy</strong> · 以框架取代預測，以紀律管理不確定性。</div></footer><script src="../academy.js"></script><script>const n=id=>Number(document.getElementById(id).value)||0;function run(){const income=n('income'),expense=n('expense'),asset=n('asset'),target=n('target'),r=n('return')/100/12,saving=Math.max(income-expense,0);document.getElementById('saving').textContent='NT$ '+Math.round(saving).toLocaleString('zh-TW');document.getElementById('rate').textContent=income?(saving/income*100).toFixed(1)+'%':'—';let months=0,b=asset;while(b<target&&months<1200){b=b*(1+r)+saving;months++}document.getElementById('years').textContent=months<1200?(months/12).toFixed(1)+' 年':'超過 100 年';document.getElementById('simpleYears').textContent=saving?((Math.max(target-asset,0)/saving)/12).toFixed(1)+' 年':'無法估算'}document.getElementById('calc').onclick=run;run();</script></body></html>
