<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>資產配置再平衡表｜GugoPro Academy</title><style>:root{--bg:#f5f7fb;--s:#fff;--i:#142033;--m:#637083;--b:#dfe5ee;--a:#356ae6;--t:#10a891;--r:#e36b54}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font:16px/1.6 system-ui,"Noto Sans TC",sans-serif}.wrap{max-width:1000px;margin:auto;padding:26px 20px}.top{display:flex;justify-content:space-between;margin-bottom:34px}.brand{font-weight:800}.back,.action{color:var(--a);font-weight:750}.layout{display:grid;grid-template-columns:320px 1fr;gap:20px}.panel,.result{background:var(--s);border:1px solid var(--b);border-radius:18px;padding:25px;box-shadow:0 18px 45px #15264d12}.eyebrow{font-size:12px;color:var(--t);font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{font-size:32px;line-height:1.2;margin:8px 0 10px}h2{font-size:20px;margin:0 0 16px}label{display:block;font-size:13px;color:var(--m);font-weight:700;margin:15px 0 6px}input{width:100%;padding:11px;border:1px solid var(--b);border-radius:8px;font:inherit;background:var(--bg);color:var(--i)}button{width:100%;border:0;background:var(--a);color:#fff;padding:12px;border-radius:9px;font-weight:800;cursor:pointer;margin-top:20px}.total{font-size:30px;font-weight:850;color:var(--a);margin-bottom:18px}.row{display:grid;grid-template-columns:1.1fr .8fr .8fr .9fr;gap:8px;align-items:center;padding:13px 0;border-bottom:1px solid var(--b);font-size:14px}.head{font-size:12px;color:var(--m);font-weight:750}.buy{color:var(--t);font-weight:800}.sell{color:var(--r);font-weight:800}.bar{height:10px;background:#e9edf4;border-radius:99px;overflow:hidden;margin:17px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--t));width:0}.note{font-size:13px;color:var(--m);margin-top:22px}@media(max-width:760px){.layout{grid-template-columns:1fr}.row{grid-template-columns:1.1fr .7fr .8fr .9fr;font-size:12px}}
</style></head><body><div class="wrap"><div class="top"><a class="brand" href="../">GugoPro Academy</a><a class="back" href="../">← 回到課程</a></div><div class="layout"><section class="panel"><div class="eyebrow">Interactive lab · 02</div><h1>配置與再平衡</h1><p>輸入目前持倉與目標權重，找出需要補強或減碼的部位。再平衡不是追逐報酬，而是把風險拉回計畫。</p><label>總資產（元）</label><input id="total" type="number" value="1000000" min="0"><label>股票目前市值</label><input id="eq" type="number" value="620000"><label>股票目標權重（%）</label><input id="eqt" type="number" value="60"><label>債券目前市值</label><input id="bd" type="number" value="280000"><label>債券目標權重（%）</label><input id="bdt" type="number" value="30"><label>現金目前市值</label><input id="cash" type="number" value="100000"><label>現金目標權重（%）</label><input id="casht" type="number" value="10"><button id="calc">更新配置</button></section><section class="result"><div class="eyebrow">Rebalance plan</div><h2>配置偏離與行動建議</h2><div class="total" id="sum">—</div><div class="bar"><i id="bar"></i></div><div class="row head"><span>資產</span><span>目前權重</span><span>目標權重</span><span>建議金額</span></div><div id="rows"></div><p class="note">建議金額為理論差額，未考慮稅務、交易費、流動性與最小交易單位。請先設定可接受的偏離範圍再執行。</p></section></div></div><script>const $=id=>document.getElementById(id),money=n=>'NT$ '+Math.round(n).toLocaleString('zh-TW');function calc(){let t=+$('total').value||0;let data=[['股票',+$('eq').value||0,+$('eqt').value||0],['債券',+$('bd').value||0,+$('bdt').value||0],['現金',+$('cash').value||0,+$('casht').value||0]];let total=data.reduce((s,x)=>s+x[1],0)||1;$('sum').textContent=money(total);$('bar').style.width=Math.min(100,total/t*100)+'%';$('rows').innerHTML=data.map(x=>{let cur=x[1]/total*100,diff=t*x[2]/100-x[1];return `<div class="row"><strong>${x[0]}</strong><span>${cur.toFixed(1)}%</span><span>${x[2].toFixed(1)}%</span><span class="${diff>=0?'buy':'sell'}">${diff>=0?'買入 ':'減碼 '}${money(Math.abs(diff))}</span></div>`}).join('')}$('calc').onclick=calc;calc();</script></body></html>
