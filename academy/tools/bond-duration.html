<body><header class="topbar"><div class="shell nav"><a class="brand" href="../index.html">GugoPro <span>Academy</span></a><nav class="navlinks"><a href="../index.html#curriculum">課程路徑</a><a href="../index.html#tools">互動工具</a><button aria-label="切換深色模式" class="theme-btn" data-theme="">◐</button></nav></div></header>
<main class="tool-page"><a class="back" href="../index.html#tools">← 返回互動工具實驗室</a><div class="tool-layout"><section class="panel"><span class="tag">債券 / 利率</span><h1>債券久期敏感度</h1><p>用修正久期估算殖利率變動對債券價格的初步影響，建立利率風險的直覺。</p><label for="price">債券價格（% of par）</label><input id="price" min="0" type="number" value="100"/><label for="duration">修正久期（年）</label><input id="duration" min="0" type="number" value="6.5"/><label for="change">殖利率變動（百分點）</label><input id="change" step="0.1" type="number" value="1"/><label for="convexity">凸性（可選）</label><input id="convexity" min="0" type="number" value="45"/><button class="calc" id="calc">更新計算</button><p class="note">本工具只在瀏覽器計算，不會上傳輸入值。結果是教育示範，不構成投資建議。</p></section><section class="result"><div class="eyebrow">Decision dashboard</div><h2>價格變動估算</h2><div class="result-big" id="impact">—</div><div class="metric-grid"><div class="metric"><small>估算後價格</small><b id="newPrice">—</b></div><div class="metric"><small>久期效果</small><b id="durationEffect">—</b></div><div class="metric"><small>凸性修正</small><b id="convexityEffect">—</b></div></div><div class="callout compact"><p><strong>重要限制：</strong>久期是局部近似，實際價格還會受信用利差、流動性、票息與殖利率曲線形狀影響。利率上升通常使價格下跌，但不是所有債券的風險相同。</p></div></section></div></main><footer class="footer"><div class="shell"><strong>GugoPro Academy</strong> · 以框架取代預測，以紀律管理不確定性。</div></footer><script src="../academy.js?v=20260827-i18n1"></script><script>const n=id=>Number(document.getElementById(id).value)||0;function run(){const p=n('price'),d=n('duration'),y=n('change')/100,c=n('convexity'),linear=-d*y,convex=.5*c*y*y,total=linear+convex;document.getElementById('impact').textContent=(total*100).toFixed(2)+'%';document.getElementById('newPrice').textContent=(p*(1+total)).toFixed(2);document.getElementById('durationEffect').textContent=(linear*100).toFixed(2)+'%';document.getElementById('convexityEffect').textContent='+'+(convex*100).toFixed(2)+'%'}document.getElementById('calc').onclick=run;run();</script><script data-gugopro-i18n="true" defer="" src="../../i18n/gugopro-i18n.js?v=20260827-i18n1"></script></body></html>
