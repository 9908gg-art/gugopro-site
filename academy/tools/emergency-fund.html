<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>緊急預備金估算｜GugoPro Academy</title><link rel="stylesheet" href="../academy.css"></head><body><header class="nav"><div class="shell navin"><a class="brand" href="../">GugoPro <span>Academy</span></a><button class="theme" data-theme>切換深色</button></div></header><main class="shell tool-page"><a class="back" href="../">← 回到課程與工具</a><div class="tool-layout"><section class="panel"><div class="eyebrow">Interactive lab · 08</div><h1>緊急預備金估算</h1><p>把短期不可避免的支出與收入波動納入現金規劃，避免在市場下跌時被迫出售長期資產。</p><label>每月必要支出（元）</label><input id="expense" type="number" value="50000"><label>每月固定負債支出（元）</label><input id="debt" type="number" value="10000"><label>收入穩定度</label><select id="stability"><option value="3">穩定：受薪且波動低</option><option value="6" selected>中等：獎金/接案占比一般</option><option value="9">波動：自營或收入高度不確定</option></select><label>目前可用現金（元）</label><input id="cash" type="number" value="240000"><button class="calc" id="calc">估算現金緩衝</button></section><section class="result"><div class="eyebrow">Defensive planning</div><h2>建議緩衝範圍</h2><div class="result-big" id="target">—</div><div class="metric-grid"><div class="metric"><span class="sub">每月基準支出</span><b id="monthly">—</b></div><div class="metric"><span class="sub">目前覆蓋月數</span><b id="months">—</b></div><div class="metric"><span class="sub">距離下限</span><b id="gap">—</b></div></div><p class="note">月數只是起點；保險保障、失業給付、家庭責任、所在地流動性與資產可變現性都會改變合理範圍。預備金重點是可用與本金穩定。</p></section></div></main><script src="../academy.js"></script><script>bindCalc('calc',()=>{let m=num('expense')+num('debt'),months=Number(document.getElementById('stability').value),cash=num('cash'),low=m*months,high=m*(months+3);document.getElementById('target').textContent=money(low)+' – '+money(high);document.getElementById('monthly').textContent=money(m);document.getElementById('months').textContent=(m?cash/m:0).toFixed(1)+' 個月';document.getElementById('gap').textContent=cash>=low?'已達下限':money(low-cash)});</script></body></html>
