</head><body><header class="nav"><div class="shell navin"><a class="brand" href="../">GugoPro <span>Academy</span></a><button class="theme" data-theme="">切換深色</button></div></header><main class="shell tool-page"><a class="back" href="../">← 回到課程與工具</a><div class="tool-layout"><section class="panel"><div class="eyebrow">Interactive lab · 07</div><h1>部位大小計算</h1><p>先決定一次交易最多願意承擔多少損失，再由進場價與失效價反推部位。這是風險預算工具，不是買賣訊號。</p><label>帳戶資產（元）</label><input id="account" type="number" value="1000000"/><label>單筆風險上限（%）</label><input id="risk" step="0.1" type="number" value="1"/><label>計畫進場價</label><input id="entry" type="number" value="100"/><label>失效/停損價</label><input id="stop" type="number" value="90"/><label>每股交易成本（元）</label><input id="fee" step="0.1" type="number" value="0.5"/><button class="calc" id="calc">反推最大部位</button></section><section class="result"><div class="eyebrow">Risk budget</div><h2>單筆風險預算</h2><div class="result-big" id="shares">—</div><div class="metric-grid"><div class="metric"><span class="sub">可承擔損失</span><b id="budget">—</b></div><div class="metric"><span class="sub">每股風險</span><b id="unit">—</b></div><div class="metric"><span class="sub">名目部位</span><b id="notional">—</b></div></div><p class="note">實際部位還應受流動性、集中度、跳空風險、融資與投資政策限制；若停損價不代表真正的 thesis invalidation，計算會產生虛假的精確感。</p></section></div></main><script src="../academy.js?v=20260827-i18n1"></script><script>bindCalc('calc',()=>{let a=num('account'),r=num('risk')/100,e=num('entry'),st=num('stop'),fee=num('fee'),budget=a*r,unit=Math.abs(e-st)+fee,qty=unit?Math.floor(budget/unit):0;document.getElementById('shares').textContent=qty.toLocaleString('zh-TW')+' 股';document.getElementById('budget').textContent=money(budget);document.getElementById('unit').textContent=money(unit);document.getElementById('notional').textContent=money(qty*e)});</script></body></html>
