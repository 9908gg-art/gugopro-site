<!DOCTYPE html>

<html lang="zh-TW"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>DCF 估值情境｜GugoPro Academy</title><link href="../academy.css" rel="stylesheet"/><link href="https://gugopro.com/academy/tools/dcf-valuation.html" hreflang="zh-Hant" rel="alternate"/><link href="https://gugopro.com/academy/tools/dcf-valuation.html?lang=zh-CN" hreflang="zh-Hans" rel="alternate"/><link href="https://gugopro.com/academy/tools/dcf-valuation.html?lang=en" hreflang="en" rel="alternate"/><link href="https://gugopro.com/academy/tools/dcf-valuation.html?lang=ja" hreflang="ja" rel="alternate"/><link href="https://gugopro.com/academy/tools/dcf-valuation.html?lang=de" hreflang="de" rel="alternate"/><link href="https://gugopro.com/academy/tools/dcf-valuation.html?lang=fr" hreflang="fr" rel="alternate"/><link href="https://gugopro.com/academy/tools/dcf-valuation.html?lang=es" hreflang="es" rel="alternate"/><link href="https://gugopro.com/academy/tools/dcf-valuation.html?lang=pt" hreflang="pt" rel="alternate"/><link href="https://gugopro.com/academy/tools/dcf-valuation.html" hreflang="x-default" rel="alternate"/></head><body><header class="nav"><div class="shell navin"><a class="brand" href="../">GugoPro <span>Academy</span></a><button class="theme" data-theme="">切換深色</button></div></header><main class="shell tool-page"><a class="back" href="../">← 回到課程與工具</a><div class="tool-layout"><section class="panel"><div class="eyebrow">Interactive lab · 06</div><h1>DCF 估值情境</h1><p>以簡化的兩階段 DCF 觀察假設如何影響企業價值。請把它當成敏感度練習，不是精確目標價。</p><label>目前自由現金流（百萬元）</label><input id="fcf" type="number" value="100"/><label>前五年成長率（%）</label><input id="growth" step="0.5" type="number" value="8"/><label>永續成長率（%）</label><input id="terminal" step="0.1" type="number" value="3"/><label>折現率 WACC（%）</label><input id="wacc" step="0.1" type="number" value="10"/><label>淨負債（百萬元）</label><input id="debt" type="number" value="200"/><label>流通股數（百萬股）</label><input id="shares" type="number" value="100"/><button class="calc" id="calc">計算情境價值</button></section><section class="result"><div class="eyebrow">Valuation lens</div><h2>企業價值拆解</h2><div class="metric-grid"><div class="metric"><span class="sub">營運現值</span><b id="pv">—</b></div><div class="metric"><span class="sub">終值現值</span><b id="tv">—</b></div><div class="metric"><span class="sub">每股示意價值</span><b id="eq">—</b></div></div><table class="table"><thead><tr><th>年度</th><th>預估 FCF</th><th>折現因子</th><th>現值</th></tr></thead><tbody id="rows"></tbody></table><p class="note">若折現率接近或低於永續成長率，模型會失去意義；實務上還需處理稅後資本成本、稀釋股數、營運資本與循環性。</p></section></div></main><script src="../academy.js?v=20260827-i18n1"></script><script>bindCalc('calc',()=>{let f=num('fcf'),g=num('growth')/100,t=num('terminal')/100,w=num('wacc')/100,d=num('debt'),s=num('shares'),pv=0,html='';for(let n=1;n<=5;n++){let cf=f*Math.pow(1+g,n),df=1/Math.pow(1+w,n),v=cf*df;pv+=v;html+=`<tr><td>${n}</td><td>${cf.toFixed(1)}</td><td>${df.toFixed(3)}</td><td>${v.toFixed(1)}</td></tr>`}let last=f*Math.pow(1+g,5),tv=w>t?last*(1+t)/(w-t):0,tvp=tv/Math.pow(1+w,5),ev=pv+tvp,eq=(ev-d)/s;document.getElementById('pv').textContent= pv.toFixed(1)+' M';document.getElementById('tv').textContent=tvp.toFixed(1)+' M';document.getElementById('eq').textContent=eq.toFixed(2)+' / 股';document.getElementById('rows').innerHTML=html});</script><script data-gugopro-i18n="true" defer="" src="../../i18n/gugopro-i18n.js?v=20260827-i18n1"></script></body></html>
