<!DOCTYPE html>

<html lang="zh-TW"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>歷史 VaR 估算器｜GugoPro Academy</title><style>:root{--bg:#f5f7fb;--s:#fff;--i:#142033;--m:#637083;--b:#dfe5ee;--a:#356ae6;--t:#10a891;--r:#d95d4f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font:16px/1.6 system-ui,"Noto Sans TC",sans-serif}.wrap{max-width:900px;margin:auto;padding:26px 20px}.top{display:flex;justify-content:space-between;margin-bottom:34px}.brand{font-weight:800}.back{color:var(--a);font-weight:750}.layout{display:grid;grid-template-columns:330px 1fr;gap:20px}.panel,.result{background:var(--s);border:1px solid var(--b);border-radius:18px;padding:26px;box-shadow:0 18px 45px #15264d12}.eyebrow{font-size:12px;color:var(--t);font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{font-size:32px;line-height:1.2;margin:8px 0 10px}h2{font-size:20px;margin:0 0 20px}label{display:block;font-size:13px;color:var(--m);font-weight:700;margin:15px 0 6px}input,textarea{width:100%;padding:11px;border:1px solid var(--b);border-radius:8px;font:inherit;background:var(--bg);color:var(--i)}textarea{min-height:130px;resize:vertical}button{width:100%;border:0;background:var(--a);color:#fff;padding:12px;border-radius:9px;font-weight:800;cursor:pointer;margin-top:20px}.risk{font-size:40px;color:var(--r);font-weight:850;line-height:1.2}.sub{color:var(--m);font-size:13px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}.metric{background:var(--bg);padding:14px;border-radius:11px}.metric b{display:block;font-size:21px}.note{font-size:13px;color:var(--m);margin-top:24px}@media(max-width:700px){.layout{grid-template-columns:1fr}.risk{font-size:34px}}
</style><link href="https://gugopro.com/academy/tools/var-calculator.html" hreflang="zh-Hant" rel="alternate"/><link href="https://gugopro.com/academy/tools/var-calculator.html?lang=zh-CN" hreflang="zh-Hans" rel="alternate"/><link href="https://gugopro.com/academy/tools/var-calculator.html?lang=en" hreflang="en" rel="alternate"/><link href="https://gugopro.com/academy/tools/var-calculator.html?lang=ja" hreflang="ja" rel="alternate"/><link href="https://gugopro.com/academy/tools/var-calculator.html?lang=de" hreflang="de" rel="alternate"/><link href="https://gugopro.com/academy/tools/var-calculator.html?lang=fr" hreflang="fr" rel="alternate"/><link href="https://gugopro.com/academy/tools/var-calculator.html?lang=es" hreflang="es" rel="alternate"/><link href="https://gugopro.com/academy/tools/var-calculator.html?lang=pt" hreflang="pt" rel="alternate"/><link href="https://gugopro.com/academy/tools/var-calculator.html" hreflang="x-default" rel="alternate"/></head><body><div class="wrap"><div class="top"><a class="brand" href="../">GugoPro Academy</a><a class="back" href="../">← 回到課程</a></div><div class="layout"><section class="panel"><div class="eyebrow">Interactive lab · 04</div><h1>歷史 VaR 估算</h1><p>用一組歷史日報酬，估計在指定信賴水準下，一天可能遇到的損失門檻。</p><label>投資組合市值（元）</label><input id="value" type="number" value="1000000"/><label>信賴水準（%）</label><input id="conf" max="99.9" min="50" step="0.1" type="number" value="95"/><label>歷史日報酬（%），以逗號或換行分隔</label><textarea id="returns">1.2,-0.8,0.4,-1.5,0.7,-2.1,0.3,1.0,-0.4,0.8,-1.0,0.2,-0.6,1.4,-0.2,0.5,-1.8,0.9,-0.3,0.1</textarea><button id="calc">估算單日 VaR</button></section><section class="result"><div class="eyebrow">Risk lens</div><h2>歷史法單日損失門檻</h2><div class="risk" id="var">—</div><div class="sub" id="detail">—</div><div class="metrics"><div class="metric"><span class="sub">最差單日</span><b id="min">—</b></div><div class="metric"><span class="sub">樣本筆數</span><b id="count">—</b></div></div><p class="note">VaR 不是最大損失，也不保證未來風險分布不變；壓力測試、Expected Shortfall 與流動性風險應一併考慮。此工具採歷史排序，適合教學示範。</p></section></div></div><script>const $=id=>document.getElementById(id),money=n=>'NT$ '+Math.round(n).toLocaleString('zh-TW');function calc(){let v=+$('value').value||0,c=(+$('conf').value||95)/100;let a=$('returns').value.split(/[\s,，]+/).map(Number).filter(Number.isFinite).sort((x,y)=>x-y);if(!a.length)return;let idx=Math.max(0,Math.ceil((1-c)*a.length)-1),q=a[idx],loss=Math.max(0,-q/100*v);$('var').textContent=money(loss);$('detail').textContent=`歷史報酬 ${q.toFixed(2)}%，${(c*100).toFixed(1)}% 信賴水準；超過此損失的觀測約 ${((1-c)*100).toFixed(1)}%。`;$('min').textContent=a[0].toFixed(2)+'%';$('count').textContent=a.length}$('calc').onclick=calc;calc();</script><script data-gugopro-i18n="true" defer="" src="../../i18n/gugopro-i18n.js?v=20260827-i18n1"></script></body></html>
