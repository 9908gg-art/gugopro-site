<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>資產配置壓力測試｜GugoPro Academy</title><meta name="description" content="GugoPro Academy 互動式財經教育工具：用情境、公式與敏感度理解投資決策。"><link rel="stylesheet" href="../academy.css"></head>
<body><header class="topbar"><div class="shell nav"><a class="brand" href="../index.html">GugoPro <span>Academy</span></a><nav class="navlinks"><a href="../index.html#curriculum">課程路徑</a><a href="../index.html#tools">互動工具</a><button class="theme-btn" data-theme aria-label="切換深色模式">◐</button></nav></div></header>
<main class="tool-page"><a class="back" href="../index.html#tools">← 返回互動工具實驗室</a><div class="tool-layout"><section class="panel"><span class="tag">組合 / IPS</span><h1>資產配置壓力測試</h1><p>輸入你的目標權重與組合總額，快速看見再平衡時各資產需要增加或減少多少。</p><label for="total">組合總額（NT$）</label><input id="total" type="number" value="1000000" min="0"><label for="eq">股票目標權重（%）</label><input id="eq" type="number" value="60" min="0" max="100"><label for="bd">債券目標權重（%）</label><input id="bd" type="number" value="30" min="0" max="100"><label for="cash">現金目標權重（%）</label><input id="cash" type="number" value="10" min="0" max="100"><label for="eqc">目前股票金額（NT$）</label><input id="eqc" type="number" value="520000" min="0"><label for="bdc">目前債券金額（NT$）</label><input id="bdc" type="number" value="320000" min="0"><button class="calc" id="calc">更新計算</button><p class="note">本工具只在瀏覽器計算，不會上傳輸入值。結果是教育示範，不構成投資建議。</p></section><section class="result"><div class="eyebrow">Decision dashboard</div><h2>偏離與行動建議</h2><div class="metric-grid"><div class="metric"><small>目前股票</small><b id="eqr">—</b></div><div class="metric"><small>目前債券</small><b id="bdr">—</b></div><div class="metric"><small>目前現金</small><b id="cashr">—</b></div></div><div id="allocationRows" class="insight-list"></div><div class="callout compact"><p><strong>閱讀方式：</strong>再平衡不是追逐短期漲跌，而是把組合拉回預先寫下的風險預算。實務上可搭配現金流與容許偏離區間，降低不必要交易。</p></div></section></div></main><footer class="footer"><div class="shell"><strong>GugoPro Academy</strong> · 以框架取代預測，以紀律管理不確定性。</div></footer><script src="../academy.js"></script><script>const n=id=>Number(document.getElementById(id).value)||0; function money(v){return 'NT$ '+Math.round(v).toLocaleString('zh-TW')} function run(){const total=n('total'), targets=[['股票',n('eq'),n('eqc')],['債券',n('bd'),n('bdc')]];const cash=Math.max(total-targets[0][2]-targets[1][2],0), cashTarget=n('cash');document.getElementById('eqr').textContent=total?Math.round(targets[0][2]/total*100)+'%':'—';document.getElementById('bdr').textContent=total?Math.round(targets[1][2]/total*100)+'%':'—';document.getElementById('cashr').textContent=total?Math.round(cash/total*100)+'%':'—';document.getElementById('allocationRows').innerHTML=targets.concat([['現金',cashTarget,cash]]).map(([name,t,current])=>{const desired=total*t/100, delta=desired-current;return `<div class="insight-row"><span><strong>${name}</strong><small>目標 ${t}% · 目前 ${total?Math.round(current/total*100):0}%</small></span><b class="${delta>=0?'positive':'negative'}">${delta>=0?'增加':'減少'} ${money(Math.abs(delta))}</b></div>`}).join('')} document.getElementById('calc').onclick=run;run();</script></body></html>
