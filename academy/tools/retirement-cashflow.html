<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>退休現金流模擬｜GugoPro Academy</title><link rel="stylesheet" href="../academy.css"></head><body><header class="nav"><div class="shell navin"><a class="brand" href="../">GugoPro <span>Academy</span></a><button class="theme" data-theme>切換深色</button></div></header><main class="shell tool-page"><a class="back" href="../">← 回到課程與工具</a><div class="tool-layout"><section class="panel"><div class="eyebrow">Interactive lab · 05</div><h1>退休現金流模擬</h1><p>用簡化的年度模型觀察資產在不同提領與報酬假設下的續航。模型不代表未來報酬，也未納入稅務、保險與一次性支出。</p><label>退休時資產（元）</label><input id="asset" type="number" value="10000000" min="0"><label>第一年提領（元）</label><input id="withdraw" type="number" value="400000" min="0"><label>年化名目報酬（%）</label><input id="return" type="number" value="5" step="0.1"><label>年通膨（%）</label><input id="inflation" type="number" value="2" step="0.1"><label>模擬年數</label><input id="years" type="number" value="40" min="1" max="80"><button class="calc" id="calc">執行現金流模擬</button></section><section class="result"><div class="eyebrow">Scenario output</div><h2>資產續航與壓力觀察</h2><div class="metric-grid"><div class="metric"><span class="sub">初始提領率</span><b id="rate">—</b></div><div class="metric"><span class="sub">模擬期末資產</span><b id="end">—</b></div><div class="metric"><span class="sub">資產耗盡年份</span><b id="deplete">—</b></div></div><table class="table"><thead><tr><th>年度</th><th>年初資產</th><th>提領</th><th>年末資產</th></tr></thead><tbody id="rows"></tbody></table><p class="note">解讀時請另外測試較低報酬、較高通膨、退休初期下跌與彈性支出規則；單一路徑不能被視為成功機率或保證。</p></section></div></main><script src="../academy.js"></script><script>bindCalc('calc',()=>{let a=num('asset'),w=num('withdraw'),r=num('return')/100,i=num('inflation')/100,y=Math.min(80,Math.max(1,num('years'))),initial=a;document.getElementById('rate').textContent=(w/initial*100||0).toFixed(1)+'%';let html='',deplete='未耗盡';for(let n=1;n<=y;n++){let start=a,draw=w*Math.pow(1+i,n-1);a=a*(1+r)-draw;if(a<0&&deplete==='未耗盡')deplete=n;if(n<=12)html+=`<tr><td>${n}</td><td>${money(start)}</td><td>${money(draw)}</td><td>${money(Math.max(0,a))}</td></tr>`;if(a<0)a=0}document.getElementById('end').textContent=money(a);document.getElementById('deplete').textContent=deplete==='未耗盡'?deplete:`第 ${deplete} 年`;document.getElementById('rows').innerHTML=html});</script></body></html>
