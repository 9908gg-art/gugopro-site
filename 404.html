<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta http-equiv="refresh" content="3;url=https://gugopro.com/">
  <title>頁面不存在｜GugoPro</title>
  <style>
    :root{color-scheme:dark;--bg:#070b12;--panel:rgba(16,27,44,.88);--line:rgba(85,223,209,.32);--teal:#55dfd1;--text:#f8fafc;--muted:#b8c4d4}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 5%,rgba(85,214,255,.12),transparent 36rem),linear-gradient(145deg,#070b12,#0b1220 62%,#101b2c);color:var(--text);font-family:Inter,"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,720px);padding:clamp(28px,6vw,52px);border:1px solid var(--line);border-radius:24px;background:var(--panel);box-shadow:0 24px 80px rgba(0,0,0,.38);text-align:center}
    .mark{width:56px;height:56px;margin:0 auto 20px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(135deg,#ff9d24,#ff651e);font-size:28px}
    h1{margin:0 0 14px;font-size:clamp(25px,5vw,38px);line-height:1.25}p{margin:0 auto 14px;color:var(--muted);font-size:16px;line-height:1.8}.timer{color:var(--teal);font-weight:700}
    .actions{display:flex;justify-content:center;margin-top:28px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border:1px solid rgba(85,223,209,.48);border-radius:12px;background:linear-gradient(110deg,rgba(85,223,209,.17),rgba(16,27,44,.9));color:#eafffc;font-weight:800;text-decoration:none;transition:transform .15s ease,border-color .15s ease}.button:hover{transform:translateY(-2px);border-color:var(--teal)}.button:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
    @media(max-width:480px){body{padding:16px}main{padding:28px 20px;border-radius:18px}}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✦</div>
    <h1>頁面不存在或已搬移</h1>
    <p>您所訪問的工具已升級整併至 GugoPro 生產力工具箱，正在為您跳轉至全新首頁...</p>
    <p>若未自動跳轉，請使用下方按鈕手動返回首頁。</p>
    <div class="actions"><a class="button" href="/">手動返回 GugoPro 首頁</a></div>
    <p class="timer" aria-live="polite">3 秒後自動導向首頁</p>
  </main>
  <script>
    setTimeout(() => { location.href = '/'; }, 3000);
  </script>
</body>
</html>
