name: Update Taiwan Pair Trading Data

on:
  schedule:
    # 07:00 UTC = 15:00 Asia/Taipei, Monday through Friday.
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taiwan-pairs-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install scanner dependencies
        run: python -m pip install --upgrade pip pandas numpy requests

      - name: Run Taiwan pair scanner
        run: python scripts/pairs_scanner.py --workers 16 --max-pairs 120

      - name: Commit changed data feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/tw-market/pairs-scan-results.json data/tw-market/pair-trade-records.json; then
            echo "No pair-data change to commit."
            exit 0
          fi
          git add data/tw-market/pairs-scan-results.json data/tw-market/pair-trade-records.json
          git commit -m "chore(data): update Taiwan pair scan [skip ci]"
          git push origin HEAD:main
