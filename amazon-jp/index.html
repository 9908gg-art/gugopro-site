  body.theme-jp .modal-box { background: #1C0A15; }
  .modal-header {

  @media (max-width: 768px) {
    .filter-box { flex-direction: column; align-items: stretch; }
    .btn-do-search { justify-content: center; }
    .fg-input-search { min-width: 100%; }

      name: '日本站 (amazon.co.jp)',
      countryName: 'Japan (日本)',
      baseUrl: 'https://www.amazon.co.jp/s',
      defaultTag: 'gugoprojp-22',
      storageKey: 'gugopro_amazon_jp_tag',
      dataPath: '../data/jp/categories_tree.json',
      facetsPaths: ['../data/jp/facets/electronics.json', '../data/jp/facets/computers.json'],
      currency: 'JPY (円)',
      themeClass: 'theme-jp',
      rhRating: 'p_72:p_72%2F1248879011',
      labels: {
        heroTitle: 'Amazon 🇯🇵 日本站選品與日文語法搜尋引擎',
        heroDesc: '中日雙語對照標籤導引，自動組合精準日文關鍵字跳轉 Amazon.co.jp，日本正品跨境採購必備。',
        searchPlaceholder: '輸入中文或日文關鍵字 (如: ノイズキャンセリング イヤホン)...',
        btnSearch: '前往 Amazon JP 搜尋'
      }
    }
  };

  /* App State */
  var currentMarket = 'us';
  var currentTreeData = null;

  function initMarketFromUrl() {
    var params = new URLSearchParams(window.location.search);
    var m = params.get('market') || (window.location.hash ? window.location.hash.replace('#', '') : '');
    if (m === 'jp' || m === 'us') {
      currentMarket = m;
    } else if (window.location.pathname.indexOf('amazon-jp') !== -1) {
      currentMarket = 'jp';
    } else {
      currentMarket = 'us';
    }
  }

  function getActiveTag() {
    var conf = MARKETS[currentMarket];
    return localStorage.getItem(conf.storageKey) || conf.defaultTag;
  }

  function setActiveTag(tag) {
    var conf = MARKETS[currentMarket];
    if (!tag) {
      localStorage.removeItem(conf.storageKey);
    } else {
      localStorage.setItem(conf.storageKey, tag.trim());
    }
    updateNavTag();
  }

  function updateNavTag() {
    var tag = getActiveTag();
    var navEl = document.getElementById('nav-tag-display');
    if (navEl) navEl.textContent = 'Tag: ' + tag;
  }

  function buildAmazonSearchUrl(keyword, options) {
    var conf = MARKETS[currentMarket];
    var tag = getActiveTag();
    var url = new URL(conf.baseUrl);
    url.searchParams.set('k', keyword.trim());
    url.searchParams.set('tag', tag);

    options = options || {};
    if (options.s) url.searchParams.set('s', options.s);
    if (options.rh) url.searchParams.set('rh', options.rh);

    // Price range filters
    var low = options.low || document.getElementById('input-price-low').value;
    var high = options.high || document.getElementById('input-price-high').value;
    if (low && !isNaN(Number(low))) url.searchParams.set('low-price', Math.round(Number(low)));
    if (high && !isNaN(Number(high))) url.searchParams.set('high-price', Math.round(Number(high)));

    return url.toString();
  }

  window.doSearch = function(keyword, options) {
    if (!keyword) {
      var input = document.getElementById('input-keyword');
      keyword = input ? input.value : '';
    }
    if (!keyword.trim()) return;

    var targetUrl = buildAmazonSearchUrl(keyword, options);
    window.open(targetUrl, '_blank', 'noopener,noreferrer');

    if (typeof gtag === 'function') {
      gtag('event', 'amazon_search_click', {
        'event_category': 'ecommerce',
        'event_label': currentMarket.toUpperCase() + ': ' + keyword
      });
    }
  };

  window.handleCustomSearch = function() {
    var kw = document.getElementById('input-keyword').value;
    var sort = document.getElementById('select-sort').value;
    var rating = document.getElementById('select-rating').value;
    doSearch(kw, { s: sort, rh: rating });
  };

  window.switchMarket = function(marketKey) {
    if (!MARKETS[marketKey] || currentMarket === marketKey) return;
    currentMarket = marketKey;
    
    // Update theme class on body
    if (MARKETS[currentMarket].themeClass) {
      document.body.className = MARKETS[currentMarket].themeClass;
    } else {
      document.body.className = '';
    }

    // Update Switcher buttons
    document.getElementById('btn-market-us').classList.toggle('active', currentMarket === 'us');
    document.getElementById('btn-market-jp').classList.toggle('active', currentMarket === 'jp');

    // Update UI Texts
    var conf = MARKETS[currentMarket];
    document.getElementById('hero-title').textContent = conf.labels.heroTitle;
    document.getElementById('hero-desc').textContent = conf.labels.heroDesc;
    document.getElementById('input-keyword').placeholder = conf.labels.searchPlaceholder;
    document.getElementById('label-btn-search').textContent = conf.labels.btnSearch;
    document.getElementById('crumb-root').textContent = 'Amazon ' + currentMarket.toUpperCase() + ' Store';
    document.getElementById('input-price-low').placeholder = 'Min (' + conf.currency.split(' ')[0] + ')';
    document.getElementById('input-price-high').placeholder = 'Max (' + conf.currency.split(' ')[0] + ')';

    updateNavTag();
    loadMarketData();
  };

  function loadMarketData() {
    var conf = MARKETS[currentMarket];
    var deptGrid = document.getElementById('dept-grid');
    var countSummary = document.getElementById('category-summary-count');
    
    deptGrid.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> 載入 ' + conf.name + ' 精選品類資料庫...</div>';

    fetch(conf.dataPath, { cache: 'no-store' })
      .then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(data) {
        currentTreeData = data;
        renderTree(data);
        if (conf.facetsPath) {
          loadFacets(conf.facetsPath);
        } else {
          document.getElementById('facets-container').innerHTML = '';
        }
      })
      .catch(function(err) {
        deptGrid.innerHTML = '<div style="padding:20px; color:#fca5a5; background:rgba(239,68,68,0.1); border-radius:10px;">❌ 載入資料庫失敗：' + err.message + '</div>';
      });
  }

  function loadFacets(facetsPath) {
    fetch(facetsPath, { cache: 'no-store' })
      .then(function(res) { return res.ok ? res.json() : null; })
      .then(function(data) {
        if (!data || !data.facet_groups) return;
        var container = document.getElementById('facets-container');
        var html = '<span class="facet-title"><i class="fa-solid fa-tags"></i> 快速規格標籤：</span>';
        
        data.facet_groups.forEach(function(group) {
          group.facets.forEach(function(f) {
            html += '<span class="facet-pill" onclick="applyFacetSearch(\'' + (f.search_query || f.label_jp) + '\')">' +
                      (f.label_tw || f.label_jp) +
                    '</span>';
          });
        });
        container.innerHTML = html;
      })
      .catch(function(){});
  }

  window.applyFacetSearch = function(query) {
    var input = document.getElementById('input-keyword');
    if (input) input.value = query;
    doSearch(query);
  };

  function renderTree(treeData) {
    var deptGrid = document.getElementById('dept-grid');
    var countSummary = document.getElementById('category-summary-count');
    var categories = treeData.categories || [];
    var nCats = 0, nItems = 0;

    deptGrid.innerHTML = '';
    categories.forEach(function(dept, deptIdx) {
      var deptCard = document.createElement('div');
      deptCard.className = 'dept-card' + (deptIdx === 0 ? ' expanded' : '');

      var catsHtml = '';
      (dept.categories || []).forEach(function(cat, catIdx) {
        nCats++;
        var leafHtml = '';
        (cat.leaf_items || []).forEach(function(leaf) {
          nItems++;
          leafHtml +=
            '<div class="leaf-item" onclick="doSearch(\'' + leaf.keywords.replace(/'/g, "\\'") + '\')">' +
              '<div class="leaf-name"><span>' + leaf.name + '</span> <i class="fa-solid fa-arrow-up-right-from-square"></i></div>' +
              '<div class="leaf-kw">' + leaf.keywords + '</div>' +
            '</div>';
        });

        catsHtml +=
          '<div class="cat-box' + (catIdx === 0 ? ' expanded' : '') + '">' +
            '<div class="cat-header" onclick="this.parentElement.classList.toggle(\'expanded\')">' +
              '<span><i class="fa-solid fa-caret-right"></i> ' + cat.name + ' (' + (cat.leaf_items ? cat.leaf_items.length : 0) + ')</span>' +
            '</div>' +
            '<div class="leaf-grid">' + leafHtml + '</div>' +
          '</div>';
      });

      deptCard.innerHTML =
        '<div class="dept-header" onclick="this.parentElement.classList.toggle(\'expanded\')">' +
          '<div class="dept-header-left">' +
            '<i class="fa-solid ' + (dept.icon || 'fa-box') + '"></i>' +
            '<span>' + dept.department_name + '</span>' +
          '</div>' +
          '<div style="display:flex; align-items:center; gap:10px;">' +
            '<span style="font-size:0.8rem; color:var(--text-muted);">' + (dept.categories ? dept.categories.length : 0) + ' 分類</span>' +
            '<i class="fa-solid fa-chevron-right dept-toggle-icon"></i>' +
          '</div>' +
        '</div>' +
        '<div class="dept-body"><div class="cats-container">' + catsHtml + '</div></div>';

      deptGrid.appendChild(deptCard);
    });

    countSummary.textContent = '(' + categories.length + ' 部門 · ' + nCats + ' 分類 · ' + nItems + ' 精選品項)';
  }

  /* Tag Modal Functions */
  window.openTagModal = function() {
    var conf = MARKETS[currentMarket];
    document.getElementById('modal-market-name').textContent = conf.name;
    document.getElementById('modal-input-tag').value = getActiveTag();
    document.getElementById('modal-tag').classList.add('show');
  };

  window.closeTagModal = function() {
    document.getElementById('modal-tag').classList.remove('show');
  };

  window.saveTagFromModal = function() {
    var val = document.getElementById('modal-input-tag').value;
    setActiveTag(val);
    closeTagModal();
    alert('已成功更新 ' + MARKETS[currentMarket].name + ' 的分潤標籤！');
  };

  window.resetDefaultTag = function() {
    var conf = MARKETS[currentMarket];
    setActiveTag(conf.defaultTag);
    document.getElementById('modal-input-tag').value = conf.defaultTag;
    alert('已重設為預設標籤：' + conf.defaultTag);
  };

  /* Initialize */
  initMarketFromUrl();
  switchMarket(currentMarket);

})();
</script>
</body>
</html>
