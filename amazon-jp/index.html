<!-- Font Awesome 6 -->

<style>
  :root {
    --jp-primary: #E4002B;
    --jp-secondary: #A1061F;
    --jp-accent: #FFFFFF;
    --bg-start: #1A050A;
    --bg-end: #2C0A12;
    --card-bg: rgba(255, 255, 255, 0.06);
    --card-border: rgba(255, 255, 255, 0.12);
    --text-main: #F5F7FA;
    --text-muted: #C9A9B0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 55%, #3D0C16 100%);
    color: var(--text-main);
    padding-bottom: 60px;
  }

  /* ===== Top Navigation ===== */
  .top-nav {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--card-border);
    padding: 10px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .top-nav a {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 999px;
    transition: all 0.25s ease;
    white-space: nowrap;
  }
  .top-nav a:hover { background: rgba(255, 255, 255, 0.08); color: var(--text-main); }
  .top-nav a.active {
    background: linear-gradient(135deg, var(--jp-primary), var(--jp-secondary));
    color: #fff;
    box-shadow: 0 4px 14px rgba(228, 0, 43, 0.35);
  }

  /* ===== Hero ===== */
  .hero {
    text-align: center;
    padding: 48px 20px 24px;
  }
  .hero h1 {
    font-size: clamp(26px, 4vw, 40px);
    background: linear-gradient(135deg, #FF8FA3, var(--jp-primary), #FFC3CD);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 12px;
  }
  .hero p { color: var(--text-muted); max-width: 640px; margin: 0 auto; line-height: 1.7; }

  .kofi-wrap { margin-top: 20px; }

  /* ===== Grid ===== */
  .container { max-width: 1080px; margin: 0 auto; padding: 8px 20px 0; }

  .category-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 22px;
    margin-top: 28px;
  }

  /* ===== Category Card ===== */
  .category-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 26px 24px 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .category-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 40px rgba(228, 0, 43, 0.2);
  }
  .category-card .card-head {
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    user-select: none;
  }
  .category-card .icon-circle {
    width: 52px;
    height: 52px;
    flex-shrink: 0;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--jp-primary), var(--jp-secondary));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: #fff;
    box-shadow: 0 6px 16px rgba(228, 0, 43, 0.3);
  }
  .category-card .card-title { font-size: 19px; font-weight: 700; }
  .category-card .card-subtitle { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
  .category-card .toggle-icon {
    margin-left: auto;
    color: var(--text-muted);
    transition: transform 0.3s ease;
  }
  .category-card.open .toggle-icon { transform: rotate(180deg); }

  .subcategory-list {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease;
    margin-top: 0;
  }
  .category-card.open .subcategory-list { max-height: 500px; margin-top: 18px; }

  .sub-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 12px 14px;
    margin-top: 10px;
    color: var(--text-main);
    text-decoration: none;
    font-size: 14.5px;
    transition: all 0.25s ease;
  }
  .sub-item:hover {
    background: linear-gradient(135deg, rgba(228, 0, 43, 0.18), rgba(255, 255, 255, 0.1));
    border-color: rgba(228, 0, 43, 0.4);
    transform: translateX(4px);
  }
  .sub-item i { color: var(--jp-primary); }

  .loading, .error {
    text-align: center;
    color: var(--text-muted);
    padding: 60px 20px;
    font-size: 15px;
  }
  .error i { color: #E16A6A; margin-right: 8px; }

  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 12.5px;
    margin-top: 56px;
    padding: 0 20px;
  }
  footer a { color: var(--jp-primary); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 560px) {
    .top-nav { justify-content: flex-start; }
    .top-nav a { font-size: 13px; padding: 7px 11px; }
  }
</style>

<body>

<!-- 頂部導覽列 -->
<nav class="top-nav" aria-label="區域導覽">

  <a href="./index.html" class="active"><i class="fa-solid fa-torii-gate"></i> 🇯🇵 日本亞馬遜</a>
  <a href="https://gugopro.com"><i class="fa-solid fa-house"></i> 返回 GugoPro 首頁</a>
  <a href="../"><i class="fa-solid fa-door-open"></i> 返回商城門戶</a>
</nav>

<!-- Hero -->
<header class="hero">
  <h1><i class="fa-solid fa-cart-shopping"></i> Amazon JP 日本亞馬遜專區</h1>
  <p>精選電競設備、麻將棋牌周邊、量化交易書單與塔羅靈性好物，點擊下方分類即可一鍵前往日本亞馬遜（amazon.co.jp）搜尋，支援 GugoPro 官方推廣連結。</p>
  <div class="kofi-wrap">
    <a href="https://ko-fi.com/R1K123XRS9" target="_blank" rel="noopener" class="kofi-button" style="background:#72a4f2; color:#fff; padding:10px 18px; border-radius:8px; text-decoration:none; display:inline-flex; align-items:center; gap:8px; font-weight:bold;"><i class="fa-solid fa-mug-hot"></i> Buy me a coffee</a>
  </div>
</header>

<!-- 分類卡片容器 -->
<main class="container">
  <div id="category-grid" class="category-grid">
    <p class="loading"><i class="fa-solid fa-spinner fa-spin"></i> 載入分類資料中...</p>
  </div>
</main>

<footer>
  <p>GugoPro (gugopro.com) 日本亞馬遜專區 · 商品搜尋由 amazon.co.jp 提供，部分連結含官方推廣代碼（tag=gugopro-22）。</p>
</footer>

<script>
(function () {
  var grid = document.getElementById('category-grid');
  var AFFILIATE_TAG = 'gugopro-22';

  function renderError() {
    grid.innerHTML = '<p class="error"><i class="fa-solid fa-triangle-exclamation"></i>分類資料載入失敗，請稍後重試。</p>';
  }

  function buildSubcard(sub) {
    var url = 'https://www.amazon.co.jp/s?k=' + encodeURIComponent(sub.keywords_jp) + '&tag=' + AFFILIATE_TAG;
    var a = document.createElement('a');
    a.className = 'sub-item';
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.setAttribute('aria-label', sub.name + ' - 前往日本亞馬遜搜尋');
    a.innerHTML = '<i class="fa-solid fa-arrow-up-right-from-square"></i><span>' + sub.name + '</span>';
    return a;
  }

  function buildCategoryCard(cat) {
    var card = document.createElement('div');
    card.className = 'category-card';

    var head = document.createElement('div');
    head.className = 'card-head';
    head.setAttribute('role', 'button');
    head.setAttribute('tabindex', '0');
    head.setAttribute('aria-expanded', 'false');
    head.setAttribute('aria-controls', 'sublist-' + cat.id);
    head.innerHTML =
      '<div class="icon-circle"><i class="fa-solid ' + cat.icon + '"></i></div>' +
      '<div><div class="card-title">' + cat.name_zh + '</div>' +
      '<div class="card-subtitle">' + cat.name_en + '</div></div>' +
      '<i class="fa-solid fa-chevron-down toggle-icon"></i>';

    var list = document.createElement('div');
    list.className = 'subcategory-list';
    list.id = 'sublist-' + cat.id;
    cat.subcategories.forEach(function (sub) { list.appendChild(buildSubcard(sub)); });

    var expanded = false;
    function toggle() {
      expanded = !expanded;
      card.classList.toggle('open', expanded);
      head.setAttribute('aria-expanded', expanded ? 'true' : 'false');
    }
    head.addEventListener('click', toggle);
    head.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });

    card.appendChild(head);
    card.appendChild(list);
    return card;
  }

  function render(categories) {
    grid.innerHTML = '';
    categories.forEach(function (cat) { grid.appendChild(buildCategoryCard(cat)); });
  }

  fetch('../data/amazon-categories.json', { cache: 'no-store' })
    .then(function (res) {
      if (!res.ok) { throw new Error('HTTP ' + res.status); }
      return res.json();
    })
    .then(function (data) { render(data.categories); })
    .catch(renderError);
})();
</script>

</body>
